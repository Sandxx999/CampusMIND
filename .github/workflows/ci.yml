name: CampusMIND 2.0 CI Foundation

on:
  push:
    branches: [ main, campusmind-2.0 ]
  pull_request:
    branches: [ main, campusmind-2.0 ]

jobs:
  backend-tests:
    name: Run FastAPI & RAG Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Pytest test suite
        env:
          APP_ENV: test
          DEMO_MODE: "true"
          JWT_SECRET_KEY: "ci_test_secret_key_campusmind_32chars"
          CORS_ORIGINS: "http://localhost:5173,http://localhost:3000"
        run: |
          python -m pytest -v

  frontend-build:
    name: Build React/Vite Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run frontend production build
        run: |
          cd frontend
          npm run build
