version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: campusmind_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusmind_dev}
      POSTGRES_USER: ${POSTGRES_USER:-campusmind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusmind_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-campusmind_user} -d $${POSTGRES_DB:-campusmind_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - campusmind-net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: campusmind_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DEMO_MODE=${DEMO_MODE:-true}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./backend/campusmind.db}
      - CHROMA_DB_DIR=./backend/chroma_db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/campusmind.db:/app/campusmind.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - campusmind-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusmind_frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - campusmind-net

networks:
  campusmind-net:
    driver: bridge

volumes:
  postgres-data:
