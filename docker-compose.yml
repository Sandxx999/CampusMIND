version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusmind_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DEMO_MODE=${DEMO_MODE:-true}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:80}
      - DATABASE_URL=sqlite:///./backend/campusmind.db
      - CHROMA_DB_DIR=./backend/chroma_db
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/campusmind.db:/app/campusmind.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - campusmind-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusmind_frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - campusmind-net

networks:
  campusmind-net:
    driver: bridge
