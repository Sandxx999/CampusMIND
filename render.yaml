services:
  # ----------------------------------------------------------------------------
  # FastAPI Backend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: campusmind-api
    env: python
    region: singapore
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt && alembic upgrade head && python scripts/generate_students.py
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: DEMO_MODE
        value: "false"
      - key: CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: campusmind-db
          property: connectionString

  # ----------------------------------------------------------------------------
  # React / Vite Frontend Static Site
  # ----------------------------------------------------------------------------
  - type: web
    name: campusmind-ui
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ------------------------------------------------------------------------------
# Managed PostgreSQL Database Instance
# ------------------------------------------------------------------------------
databases:
  - name: campusmind-db
    databaseName: campusmind
    user: campusmind_user
    plan: free
    region: singapore
